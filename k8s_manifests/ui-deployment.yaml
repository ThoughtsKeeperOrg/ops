apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: ui
  name: ui
  namespace: thoughts-keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ui
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/thoughts-stack-default: "true"
        io.kompose.service: ui
    spec:
      containers:
        - env:
            - name: REACT_APP_BE_API_URL
              valueFrom:
                configMapKeyRef:
                  key: REACT_APP_BE_API_URL
                  name: env
          name: ui
          image: thoughts-stack-ui
          ports:
            - containerPort: 80
              hostPort: 3009
              protocol: TCP
      restartPolicy: Always
