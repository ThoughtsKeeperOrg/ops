apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: kafka-broker
  name: kafka-broker
  namespace: thoughts-keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kafka-broker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/thoughts-stack-default: "true"
        io.kompose.service: kafka-broker
    spec:
      containers:
        - env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INSIDE://kafka-broker.thoughts-keeper.svc.cluster.local:9093,OUTSIDE://kafka-broker.thoughts-keeper.svc.cluster.local:9092
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INSIDE
            - name: KAFKA_LISTENERS
              value: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
          image: bitnamilegacy/kafka:3.9.0
          name: kafka-broker
          ports:
            - containerPort: 9092
              hostPort: 9092
              protocol: TCP
          volumeMounts:
            - mountPath: /Kafka
              name: kafka-broker-claim0
      restartPolicy: Always
      volumes:
        - name: kafka-broker-claim0
          persistentVolumeClaim:
            claimName: kafka-broker-claim0
