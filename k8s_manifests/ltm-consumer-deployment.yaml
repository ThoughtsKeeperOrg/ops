apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: ltm-consumer
  name: ltm-consumer
  namespace: thoughts-keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ltm-consumer
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/thoughts-stack-default: "true"
        io.kompose.service: ltm-consumer
    spec:
      containers:
        - args:
            - bundle
            - exec
            - karafka
            - server
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  key: DB_HOST
                  name: env
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  key: DB_NAME
                  name: env
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: DB_PASSWORD
                  name: env
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  key: DB_PORT
                  name: env
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: DB_USERNAME
                  name: env
            - name: KAFKA_CLIENT_ID
              value: ltm_consumer
            - name: KAFKA_HOST
              valueFrom:
                configMapKeyRef:
                  key: KAFKA_HOST
                  name: env
            - name: KAFKA_PORT
              valueFrom:
                configMapKeyRef:
                  key: KAFKA_PORT
                  name: env
            - name: KAFKA_SOCKET
              valueFrom:
                configMapKeyRef:
                  key: KAFKA_SOCKET
                  name: env
            - name: LTM_STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  key: LTM_STORAGE_PATH
                  name: env
            - name: NEO4J_DB
              valueFrom:
                configMapKeyRef:
                  key: NEO4J_DB
                  name: env
            - name: NEO4J_HOST
              valueFrom:
                configMapKeyRef:
                  key: NEO4J_HOST
                  name: env
            - name: NEO4J_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: NEO4J_PASSWORD
                  name: env
            - name: NEO4J_PORT
              valueFrom:
                configMapKeyRef:
                  key: NEO4J_PORT
                  name: env
            - name: NEO4J_USER
              valueFrom:
                configMapKeyRef:
                  key: NEO4J_USER
                  name: env
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  key: PORT
                  name: env
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_DB
                  name: env
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_PASSWORD
                  name: env
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_USER
                  name: env
            - name: SECRET_KEY_BASE
              valueFrom:
                configMapKeyRef:
                  key: SECRET_KEY_BASE
                  name: env
          image: thoughts-stack-ltm
          name: ltm-consumer
          volumeMounts:
            - mountPath: /ltm-consumer
              name: ltm-consumer-claim0
      restartPolicy: Always
      volumes:
        - name: ltm-consumer-claim0
          persistentVolumeClaim:
            claimName: ltm-consumer-claim0
