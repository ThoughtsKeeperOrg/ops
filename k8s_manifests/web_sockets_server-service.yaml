apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: web-sockets-server
  name: web-sockets-server
  namespace: thoughts-keeper
spec:
  ports:
    - name: "4000"
      port: 4000
      targetPort: 4000
  selector:
    io.kompose.service: web-sockets-server

---
apiVersion: v1
kind: Service
metadata:
  name: web-sockets-server-external
  namespace: thoughts-keeper
spec:
  type: LoadBalancer
  ports:
    - name: "4000"
      port: 4000
      targetPort: 4000
  selector:
    io.kompose.service: web-sockets-server